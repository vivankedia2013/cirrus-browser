name: Build and release Cirrus
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,    os: windows-latest, platform: '--win', arch: '--x64',         electron: '',        suffix: '',        extra: '' }
          - { name: mac,        os: macos-15,       platform: '--mac', arch: '--x64 --arm64', electron: '',        suffix: '',        extra: '' }
          - { name: mac-legacy, os: macos-15,       platform: '--mac', arch: '--x64',         electron: '22.3.27', suffix: '-legacy', extra: '-c.mac.minimumSystemVersion=10.13' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Use Electron ${{ matrix.electron }} for old macOS
        if: matrix.electron != ''
        run: npm install --no-save electron@${{ matrix.electron }}
      - name: Build Windows installer
        if: matrix.platform == '--win'
        run: npx electron-builder --win nsis ${{ matrix.arch }} --publish never "-c.artifactName=Cirrus-\${version}-\${os}-\${arch}${{ matrix.suffix }}.\${ext}"
      - name: Build macOS .zip
        if: matrix.platform == '--mac'
        run: npx electron-builder --mac zip ${{ matrix.arch }} --publish never ${{ matrix.extra }} "-c.artifactName=Cirrus-\${version}-\${os}-\${arch}${{ matrix.suffix }}.\${ext}"
      - name: Build macOS .dmg (retries)
        if: matrix.platform == '--mac'
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            npx electron-builder --mac dmg ${{ matrix.arch }} --publish never ${{ matrix.extra }} "-c.artifactName=Cirrus-\${version}-\${os}-\${arch}${{ matrix.suffix }}.\${ext}" && exit 0
            echo "dmg attempt $attempt failed, retrying..."; sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: cirrus-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cirrus-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cirrus ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Cirrus: a fast, private browser with a built-in AI tab, CPU and RAM limiter, password vault and custom backgrounds.
            Windows 10/11: Cirrus-*-win-x64.exe
            Mac Apple chip (macOS 11-26): Cirrus-*-mac-arm64.dmg or .zip
            Mac Intel chip (macOS 11-26): Cirrus-*-mac-x64.dmg or .zip
            Mac Intel (macOS 10.13-10.15): Cirrus-*-mac-x64-legacy.dmg or .zip
            Installers are not code-signed. Windows: More info, then Run anyway. macOS: right-click the app, then Open.
          files: artifacts/*
